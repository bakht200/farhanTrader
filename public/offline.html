<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Farhan Traders</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #F5F1E8; color: #111827; }
        .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .card { background: #fff; max-width: 440px; width: 100%; border-radius: 12px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
        h1 { font-size: 1.5rem; margin: 0 0 8px; }
        p { color: #4B5563; line-height: 1.5; }
        button { width: 100%; margin-top: 16px; background: #f97316; color: #fff; border: 0; border-radius: 8px; padding: 12px 16px; font-weight: 600; cursor: pointer; }
        button:hover { background: #ea580c; }
        a { color: #ea580c; }
        .muted { font-size: 0.875rem; color: #6B7280; margin-top: 16px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>You are offline</h1>
        <p id="msg">Checking your connection…</p>
        <p>If you have signed in on this device before, open <a href="/login">Login</a> to unlock offline mode. Cached screens you visited while online may still open.</p>
        <button type="button" id="retry">Retry connection</button>
        <p class="muted">Every shop device must connect and log in once online before relying on offline mode.</p>
    </div>
</div>
<script>
    function tellWorkerOnline() {
        try {
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                navigator.serviceWorker.controller.postMessage({ type: 'CONNECTIVITY', online: true });
            }
        } catch (e) {}
    }

    function reopenIntendedPage() {
        tellWorkerOnline();
        var path = location.pathname || '/';
        if (path === '/offline.html' || path.indexOf('/offline.html') !== -1) {
            location.replace('/suppliers');
            return;
        }
        location.replace(path);
    }

    async function tryRecover() {
        try {
            var res = await fetch('/up', { cache: 'no-store', credentials: 'same-origin' });
            if (res.ok) {
                var key = 'ftpos_offline_retry';
                try {
                    if (sessionStorage.getItem(key) === location.pathname) {
                        location.replace('/suppliers');
                        return true;
                    }
                    sessionStorage.setItem(key, location.pathname);
                } catch (e2) {}
                reopenIntendedPage();
                return true;
            }
        } catch (e) {}
        document.getElementById('msg').textContent =
            'This page is not available offline yet. If the shop has internet, tap Retry connection.';
        return false;
    }

    document.getElementById('retry').addEventListener('click', function () {
        try { sessionStorage.removeItem('ftpos_offline_retry'); } catch (e) {}
        document.getElementById('msg').textContent = 'Checking your connection…';
        tryRecover();
    });

    tryRecover();
</script>
</body>
</html>
